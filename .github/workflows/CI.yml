name: Build APK (Artifacts only)

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ───────────── CHECKOUT ─────────────
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      # ───────────── SHA ─────────────
      - name: Generate short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      # ───────────── JAVA ─────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: 17
          cache: gradle

      # ───────────── GRADLE ─────────────
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ───────────── BUILD ─────────────
      - name: Build Standard release
        run: ./gradlew assembleStandardRelease --stacktrace

      # ───────────── VERSION ─────────────
      - name: Get app version
        run: |
          VERSION=$(./gradlew -q printVersionName)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: v$VERSION"

      # ───────────── VERIFY ─────────────
      - name: Verify build output
        run: |
          STD_DIR="app/build/outputs/apk/standard/release"

          if [ ! -d "$STD_DIR" ]; then
            echo "Standard release directory does not exist!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi

          echo "APK output files:"
          ls -lah "$STD_DIR"

      # ───────────── STRIP PY ASSETS ─────────────
      - name: Strip cross-ABI py assets from each APK
        run: |
          set -e
          STD_DIR="app/build/outputs/apk/standard/release"

          declare -A ABI_KEEP=(
            ["universal"]=""
            ["arm64-v8a"]="assets/py.arm64-v8a"
            ["armeabi-v7a"]="assets/py.armeabi-v7a"
            ["x86"]="assets/py.x86"
            ["x86_64"]="assets/py.x86_64"
          )

          ALL_PY_DIRS=(
            "assets/py.arm64-v8a"
            "assets/py.armeabi-v7a"
            "assets/py.x86"
            "assets/py.x86_64"
          )

          for abi in "${!ABI_KEEP[@]}"; do
            apk=$(find "$STD_DIR" \
              \( -name "app-standard-${abi}-release-unsigned.apk" \
                 -o -name "app-standard-${abi}-release.apk" \) \
              | head -n 1)

            [ -z "$apk" ] && {
              echo "[$abi] No APK found, skipping."
              continue
            }

            keep="${ABI_KEEP[$abi]}"

            if [ -z "$keep" ]; then
              echo "[$abi] Universal — keeping all py assets."
              continue
            fi

            echo "[$abi] Stripping py assets, keeping only: $keep"

            WORK_DIR=$(mktemp -d)
            cp "$apk" "$WORK_DIR/original.apk"

            (
              cd "$WORK_DIR"

              for dir in "${ALL_PY_DIRS[@]}"; do
                if [ "$dir" != "$keep" ]; then
                  zip -d original.apk "${dir}/*" || true
                fi
              done
            )

            cp "$WORK_DIR/original.apk" "$apk"
            rm -rf "$WORK_DIR"

            echo "[$abi] Done. Remaining py entries:"
            unzip -l "$apk" | grep "assets/py\." || echo "  (none)"
          done

      # ───────────── CREATE CUT armeabi-v7a APK ─────────────
      - name: Create armeabi-v7a cut APK
        run: |
          set -e

          STD_DIR="app/build/outputs/apk/standard/release"

          SRC_APK=$(find "$STD_DIR" \
            \( -name "app-standard-armeabi-v7a-release-unsigned.apk" \
               -o -name "app-standard-armeabi-v7a-release.apk" \) \
            | head -n 1)

          if [ ! -f "$SRC_APK" ]; then
            echo "::error::armeabi-v7a APK not found"
            exit 1
          fi

          CUT_APK="$STD_DIR/app-standard-armeabi-v7a-cut-release-unsigned.apk"

          cp "$SRC_APK" "$CUT_APK"

          zip -d "$CUT_APK" \
            "lib/armeabi-v7a/libpython*" \
            "lib/armeabi-v7a/libpython_bin*" \
            "lib/armeabi-v7a/libllama_jni*" \
            "assets/py.armeabi-v7a/*" || true

          echo "Created cut APK:"
          ls -lh "$CUT_APK"

      # ───────────── SIGN ─────────────
      - name: Sign APKs
        run: |
          set -e

          STD_DIR="app/build/outputs/apk/standard/release"

          if [ -z "${{ secrets.SIGNING_KEYSTORE }}" ]; then
            echo "SIGNING_KEYSTORE secret is not available. Skipping signing step."
            exit 0
          fi

          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > release.keystore

          find "$STD_DIR" -name "app-standard-*-release-unsigned.apk" -type f | while read -r apk; do
            signed="${apk/-unsigned/}"

            echo "Signing: $apk"

            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$signed" \
              "$apk"

            echo "Verifying: $signed"

            $ANDROID_HOME/build-tools/34.0.0/apksigner verify "$signed"

            rm "$apk"
          done

          rm release.keystore

          echo "Signed APKs:"
          ls -lh "$STD_DIR"/app-standard-*-release.apk

      # ───────────── RENAME ─────────────
      - name: Rename APKs
        run: |
          set -e

          VERSION="v${APP_VERSION}"
          SHA="${SHORT_SHA}"

          STD_DIR="app/build/outputs/apk/standard/release"

          declare -A MAP=(
            ["universal"]="app-standard-universal-release.apk"
            ["arm64-v8a"]="app-standard-arm64-v8a-release.apk"
            ["armeabi-v7a"]="app-standard-armeabi-v7a-release.apk"
            ["armeabi-v7a-cut"]="app-standard-armeabi-v7a-cut-release.apk"
            ["x86"]="app-standard-x86-release.apk"
            ["x86_64"]="app-standard-x86_64-release.apk"
          )

          for abi in "${!MAP[@]}"; do
            src="$STD_DIR/${MAP[$abi]}"
            dst="$STD_DIR/mpvRx-${abi}-${VERSION}-${SHA}.apk"

            if [ ! -f "$src" ]; then
              echo "::error file=$src::Missing APK"
              exit 1
            fi

            mv "$src" "$dst"
          done

          echo "Final APKs:"
          ls -lh "$STD_DIR"/mpvRx-*.apk

      # ───────────── ARTIFACTS ─────────────

      - name: Upload Universal
        uses: actions/upload-artifact@v7
        with:
          name: mpvRx-universal-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/mpvRx-universal-v${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v7
        with:
          name: mpvRx-arm64-v8a-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/mpvRx-arm64-v8a-v${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v7
        with:
          name: mpvRx-armeabi-v7a-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/mpvRx-armeabi-v7a-v${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload armeabi-v7a cut
        uses: actions/upload-artifact@v7
        with:
          name: mpvRx-armeabi-v7a-cut-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/mpvRx-armeabi-v7a-cut-v${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload x86
        uses: actions/upload-artifact@v7
        with:
          name: mpvRx-x86-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/mpvRx-x86-v${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload x86_64
        uses: actions/upload-artifact@v7
        with:
          name: mpvRx-x86_64-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/mpvRx-x86_64-v${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}.apk
          retention-days: 90
          if-no-files-found: error
